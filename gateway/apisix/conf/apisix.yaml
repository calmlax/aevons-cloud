routes:
  - id: auth-route
    uri: /api/v1/auth/*
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    plugins:
      client-resource-auth: {}
      jwt-enterprise-auth:
        auth_service_url: http://127.0.0.1:10701
        user_info_path: /api/v1/auth/user
        excluded_paths:
          - /api/v1/auth/login
          - /api/v1/auth/refresh
          - /api/v1/auth/email/code
          - /api/v1/auth/register
          - /api/v1/auth/reset-password
          - /api/v1/auth/public-key
          - /api/v1/auth/authorize
          - /api/v1/auth/callback
          - /api/v1/auth/passkey/login/begin
          - /api/v1/auth/passkey/login/finish
    upstream:
      service_name: auth-service
      discovery_type: consul
      type: roundrobin

  - id: system-route
    uri: /api/v1/system/*
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    plugins:
      client-resource-auth: {}
      jwt-enterprise-auth: {}
    upstream:
      service_name: system-service
      discovery_type: consul
      type: roundrobin

  - id: log-route
    uri: /api/v1/log/*
    methods:
      - GET
      - POST
      - DELETE
    plugins:
      audit-log: {}
      jwt-enterprise-auth: {}
    upstream:
      service_name: log-service
      discovery_type: consul
      type: roundrobin

#END
