routes:
  - id: auth-route
    uri: /api/v1/auth/*
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    plugins:
      client-resource-auth: {}
      jwt-enterprise-auth: {}
    upstream:
      service_name: auth-service
      discovery_type: consul
      type: roundrobin

  - id: system-route
    uri: /api/v1/system/*
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    plugins:
      client-resource-auth: {}
      jwt-enterprise-auth: {}
    upstream:
      service_name: system-service
      discovery_type: consul
      type: roundrobin

  - id: log-route
    uri: /api/v1/log/*
    methods:
      - GET
      - POST
      - DELETE
    plugins:
      audit-log: {}
      jwt-enterprise-auth: {}
    upstream:
      service_name: log-service
      discovery_type: consul
      type: roundrobin

#END
