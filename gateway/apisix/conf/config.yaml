deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

discovery:
  consul:
    servers:
      - "http://127.0.0.1:8500"
    timeout:
      connect: 1000
      read: 1000
      wait: 60
    keepalive: false
    fetch_interval: 5
    weight: 1

apisix:
  node_listen: 9080
  enable_admin: true
  enable_admin_cors: true
  extra_lua_path: "/opt/aevons/?.lua;/opt/aevons/?/init.lua"
  admin_key:
    - name: admin
      key: replace-with-real-admin-key
      role: admin

plugins:
  - client-resource-auth
  - jwt-enterprise-auth
  - tenant-isolation
  - audit-log
  - ai-risk-control
