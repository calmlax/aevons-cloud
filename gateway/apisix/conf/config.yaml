deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

discovery:
  consul:
    servers:
      - "http://host.docker.internal:8500"
    keepalive: true
    fetch_interval: 5
    weight: 1

apisix:
  node_listen: 9080
  enable_admin: true
  enable_admin_cors: true
  extra_lua_path: "/opt/aevons/apisix/?.lua;/opt/aevons/apisix/?/init.lua"
  admin_key:
    - name: admin
      key: replace-with-real-admin-key
      role: admin

plugins:
  - client-resource-auth
  - jwt-enterprise-auth
  - tenant-isolation
  - audit-log
  - ai-risk-control
