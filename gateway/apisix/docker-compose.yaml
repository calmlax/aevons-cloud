version: "3.9"

services:
  apisix:
    image: apache/apisix:3.9.1-debian
    container_name: aevons-apisix
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./conf/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./plugins:/opt/aevons/apisix/plugins:ro
    environment:
      APISIX_STAND_ALONE: "true"
