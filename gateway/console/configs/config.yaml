server:
  name: gateway-console
  host: 192.168.31.81
  port: 10900
  env: development
  mode: debug

consul:
  address: http://127.0.0.1:8500
  enabled: true

log:
  level: info
  console: true
  file:
    dir: logs
    rotation:
      max_size_mb: 100
      max_backups: 10
      max_age_days: 30
      compress: false

cors:
  enabled: true
  allowed_origins:
    - "*"

xss:
  enabled: false

db:
  driver: mysql
  dsn: ""

redis:
  address: 127.0.0.1:6379

console:
  apisix_admin_url: http://127.0.0.1:9180
  apisix_admin_key: replace-with-real-admin-key
  swagger_ui_url: http://127.0.0.1:8088
