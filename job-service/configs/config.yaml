server:
  name: job-service
  host: 192.168.31.81
  port: 10705
  grpc_port: 10805

consul:
  enabled: true
  address: http://127.0.0.1:8500

log:
  level: info
  dir: logs
  console: true
  max_size_mb: 100
  max_backups: 10
  max_age_days: 30
  compress: false

cors:
  enabled: false
  allowed_origins:
    - "*"

db:
  driver: mysql
  dsn: root:123456@tcp(127.0.0.1:3306)/aevo_db?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime_seconds: 3600
  conn_max_idle_time_seconds: 1800

redis:
  # 支持模式：
  # - standalone：单机模式
  # - sentinel：哨兵模式
  # - cluster：集群模式
  mode: standalone
  address: 127.0.0.1:6379
  password: ""

  # 哨兵模式示例：
  # mode: sentinel
  # master_name: mymaster
  # addresses:
  #   - 127.0.0.1:26379
  #   - 127.0.0.1:26380
  #   - 127.0.0.1:26381
  # password: ""

  # 集群模式示例：
  # mode: cluster
  # addresses:
  #   - 127.0.0.1:7000
  #   - 127.0.0.1:7001
  #   - 127.0.0.1:7002
  # password: ""

xss:
  enabled: true
  excludes:
    - 

rocketmq:
  enabled: false
  name_servers:
    - "127.0.0.1:9876"
  producer:
    group: "aevo_producer"
    retry_times: 2
    send_timeout: 3
  consumer:
    group: "aevo_consumer"
    concurrency: 8

auth:
  excludes:
    - /api/swagger.json
    - /api/v1/job/ping
