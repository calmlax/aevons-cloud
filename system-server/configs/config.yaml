server:
  port: 8021
  mode: debug

log:
  level: info

cors:
  enabled: false
  allowed_origins:
    - "*"

db:
  driver: mysql
  dsn: root:123456@tcp(127.0.0.1:3306)/aevo_db?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  pool_size: 10

auth:
  access_token_ttl: 7200    # 单位：秒，2 小时
  refresh_token_ttl: 604800 # 单位：秒，7 天
  email_ttl: 300            # 单位：秒，5 分钟
  excludes:
    - /api/v1/ping
    - /swagger/*
    - /apifox/openapi.json
    - /api/v1/system/lang
    - /api/v1/auth/register
    - /api/v1/auth/login
    - /api/v1/auth/reset-password
    - /api/v1/auth/refresh
    - /api/v1/auth/email/code
    - /api/v1/auth/authorize
    - /api/v1/auth/callback
    - /api/v1/auth/public-key
    - /api/v1/auth/passkey/login/begin
    - /api/v1/auth/passkey/login/finish

xss:
  enabled: true
  excludes:
    - /api/v1/content/article/*
    - /api/v1/auth/passkey/register/finish
    - /api/v1/auth/passkey/login/finish

generator:
  api_prefix: /v1/
  exclude_tables:
    - qrtz_%
    - act_%
    - gen_%
  clean_prefixs:
    - sys_

rocketmq:
  enabled: false
  name_servers:
    - "127.0.0.1:9876"
  producer:
    group: "aevo_producer"
    retry_times: 2
    send_timeout: 3
  consumer:
    group: "aevo_consumer"
    concurrency: 8

swagger:
  enabled: false

webauthn:
  rp_id: localhost
  rp_origins:
    - http://localhost:5173
  rp_name: Aevons Admin
