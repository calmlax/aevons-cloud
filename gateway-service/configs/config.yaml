server:
  name: gateway-service
  host: 192.168.0.102
  port: 11080
  mode: debug

consul:
  enabled: true
  address: http://127.0.0.1:8500

log:
  level: info
  console: true
  file:
    dir: logs
    rotation:
      max_size_mb: 100
      max_backups: 10
      max_age_days: 30
      compress: false

cors:
  enabled: true
  allowed_origins:
    - "*"

xss:
  enabled: true
  excludes:
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /api/v1/auth/reset-password

gateway:
  trusted_proxies:
    - 127.0.0.1
  timeout_seconds: 15
  max_body_bytes: 10485760

swagger:
  enabled: true
  ui_enabled: true
  allowed_ips:
    - 127.0.0.1
    - ::1
    - 192.168.0.102
  docs:
    - name: auth-service
      service_id: auth-service
      url: http://127.0.0.1:10701/api/swagger.json
    - name: sys-service
      service_id: sys-service
      url: http://127.0.0.1:10702/api/swagger.json
    - name: log-service
      service_id: log-service
      url: http://127.0.0.1:10703/api/swagger.json
    - name: gen-service
      service_id: gen-service
      url: http://127.0.0.1:10704/api/swagger.json
    - name: job-service
      service_id: job-service
      url: http://127.0.0.1:10705/api/swagger.json

services:
  - id: auth
    name: auth-service
    prefix: /api/v1/auth/**
    discovery: consul
    load_balance: round_robin
    pass_access_token: true
    exclude_auth_routes:
      - GET:/api/v1/auth/ping
      - GET:/api/v1/auth/public-key
      - POST:/api/v1/auth/login
      - POST:/api/v1/auth/refresh
      - POST:/api/v1/auth/email/code
      - POST:/api/v1/auth/register
      - POST:/api/v1/auth/reset-password
      - GET:/api/v1/auth/authorize
      - POST:/api/v1/auth/authorize
      - GET:/api/v1/auth/callback
      - POST:/api/v1/auth/passkey/login/begin
      - POST:/api/v1/auth/passkey/login/finish
  - id: sys
    name: sys-service
    prefix: /api/v1/sys/**
    discovery: consul
    load_balance: round_robin
    pass_access_token: true
    exclude_auth_routes:
      - GET:/api/v1/sys/ping
      - GET:/api/v1/sys/lang
  - id: log
    name: log-service
    prefix: /api/v1/log/**
    discovery: consul
    load_balance: round_robin
    pass_access_token: true
    exclude_auth_routes:
      - GET:/api/v1/log/ping
  - id: gen
    name: gen-service
    prefix: /api/v1/gen/**
    discovery: consul
    load_balance: round_robin
    pass_access_token: true
    exclude_auth_routes:
      - GET:/api/v1/gen/ping
  - id: job
    name: job-service
    prefix: /api/v1/job/**
    discovery: consul
    load_balance: round_robin
    pass_access_token: true
    exclude_auth_routes:
      - GET:/api/v1/job/ping

clients:
  - client_id: admin-web
    enabled: true
    resources:
      - ALL
  - client_id: "100000"
    enabled: true
    resources:
      - ALL
  - client_id: portal-web
    enabled: true
    resources:
      - POST:/api/v1/auth/login
      - POST:/api/v1/auth/refresh
      - GET:/api/v1/auth/public-key
      - GET:/api/v1/sys/lang
      - GET:/api/v1/gen/ping
      - GET:/api/v1/job/ping
