server:
  name: system-service
  host: 192.168.0.108
  port: 10702
  grpc_port: 10802

consul:
  enabled: true
  address: http://127.0.0.1:8500

log:
  level: info

cors:
  enabled: false
  allowed_origins:
    - "*"

db:
  driver: mysql
  dsn: root:123456@tcp(127.0.0.1:3306)/aevo_db?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime_seconds: 3600
  conn_max_idle_time_seconds: 1800

redis:
  # 支持模式：
  # - standalone：单机模式
  # - sentinel：哨兵模式
  # - cluster：集群模式
  mode: standalone
  address: 127.0.0.1:6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 2
  max_retries: 3
  dial_timeout_seconds: 5
  read_timeout_seconds: 3
  write_timeout_seconds: 3

  # 哨兵模式示例：
  # mode: sentinel
  # master_name: mymaster
  # addresses:
  #   - 127.0.0.1:26379
  #   - 127.0.0.1:26380
  #   - 127.0.0.1:26381
  # password: ""
  # db: 0
  # pool_size: 10
  # min_idle_conns: 2
  # max_retries: 3
  # dial_timeout_seconds: 5
  # read_timeout_seconds: 3
  # write_timeout_seconds: 3

  # 集群模式示例：
  # mode: cluster
  # addresses:
  #   - 127.0.0.1:7000
  #   - 127.0.0.1:7001
  #   - 127.0.0.1:7002
  # password: ""
  # pool_size: 20
  # min_idle_conns: 4
  # max_retries: 3
  # dial_timeout_seconds: 5
  # read_timeout_seconds: 3
  # write_timeout_seconds: 3

auth:
  access_token_ttl: 7200    # 单位：秒，2 小时
  refresh_token_ttl: 604800 # 单位：秒，7 天
  email_ttl: 300            # 单位：秒，5 分钟
  excludes:
    - /api/swagger.json
    - /api/v1/system/ping
    - /api/v1/system/lang
    - /api/v1/auth/register
    - /api/v1/auth/login
    - /api/v1/auth/reset-password
    - /api/v1/auth/refresh
    - /api/v1/auth/email/code
    - /api/v1/auth/authorize
    - /api/v1/auth/callback
    - /api/v1/auth/public-key
    - /api/v1/auth/passkey/login/begin
    - /api/v1/auth/passkey/login/finish

xss:
  enabled: true
  excludes:
    - /api/v1/auth/passkey/register/finish
    - /api/v1/auth/passkey/login/finish

generator:
  api_prefix: /v1/
  exclude_tables:
    - qrtz_%
    - act_%
    - gen_%
  clean_prefixs:
    - sys_

rocketmq:
  enabled: false
  name_servers:
    - "127.0.0.1:9876"
  producer:
    group: "aevo_producer"
    retry_times: 2
    send_timeout: 3
  consumer:
    group: "aevo_consumer"
    concurrency: 8

webauthn:
  rp_id: localhost
  rp_origins:
    - http://localhost:5173
  rp_name: Aevons Admin
